<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="O pagină de recenzii pentru ciocolată, unde utilizatorii pot atribui stele și trimite opinii.">
  <title>Recenzie Ciocolată</title>
  <link rel="stylesheet" href="stil.css" />
</head>
<body>
  <h1>Recenzie ciocolată</h1>

  <p class="descriere">Această pagină îți permite să oferi o notă delicioasă ciocolatei preferate, printr-un sistem simplu de stele!</p>

  <img
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Chocolate_%28blue_background%29.jpg/640px-Chocolate_%28blue_background%29.jpg"
    alt="Ciocolată"
    width="300"
    onerror="this.src='fallback.jpg';"
  />

  <p>
    <label for="stelute">Atribuie numărul de stele:</label>
    <input type="number" id="stelute" min="1" max="5" />
    <button id="trimite">Trimite Recenzia!</button>
  </p>

  <div id="stele"></div>
  <div id="mesaj"></div>

  <script src="recenzie.js"></script>
</body>
</html>
